[package]
name = "offchain-agent-registry"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
publish = false

[dependencies]
tokio = { version = "1.38", features = ["full"] }
subxt = { version = "0.38", features = ["native"] }
subxt-signer = { version = "0.38", features = ["subxt", "sr25519"] }
codec = { package = "parity-scale-codec", version = "3.7", features = ["derive"] }
sp-core = { workspace = true, default-features = false, features = ["std"] }
ml-dsa = { version = "0.1.1", features = ["getrandom"] }
hex = "0.4"
thiserror = "1.0"
zeroize = "1.8"
chacha20poly1305 = "0.10"
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.3"

[dev-dependencies]
pallet-agent-registry = { workspace = true, features = ["std"] }
